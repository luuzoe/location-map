<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#e7eee9" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&amp;family=Manrope:wght@600;700&amp;display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  <title>3D Location Map</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #10211d;
      --muted: #53635e;
      --surface: rgba(255,255,255,.94);
      --surface-solid: #fff;
      --line: rgba(16,33,29,.14);
      --accent: #087c63;
      --accent-strong: #005d4a;
      --accent-soft: #d9f4eb;
      --danger: #a33127;
      --shadow: 0 15px 38px rgba(7,27,21,.19);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #edf8f4;
        --muted: #adc0b9;
        --surface: rgba(18,31,27,.94);
        --surface-solid: #14211d;
        --line: rgba(237,248,244,.15);
        --accent: #4bd0ae;
        --accent-strong: #8ee8d0;
        --accent-soft: #163d33;
        --danger: #ff9c92;
        --shadow: 0 18px 46px rgba(0,0,0,.42);
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body, .app, #map { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #dce8e3; color: var(--ink); font-family: "Noto Sans Myanmar", sans-serif; }
    button, a { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
    #map { position: absolute; inset: 0; background: #dce8e3; }

    .info-card {
      position: absolute; z-index: 5;
      top: max(12px, env(safe-area-inset-top)); left: 12px;
      width: min(390px, calc(100% - 136px));
      padding: 14px 15px 13px;
      border: 1px solid var(--line); border-radius: 16px 16px 16px 5px;
      background: var(--surface); box-shadow: var(--shadow);
      backdrop-filter: blur(13px); -webkit-backdrop-filter: blur(13px);
    }
    .status-row { display: flex; align-items: flex-start; gap: 11px; }
    .status-dot { flex: 0 0 auto; width: 11px; height: 11px; margin-top: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
    .status-dot.busy { animation: pulse 1.35s ease-in-out infinite; }
    .status-dot.error { background: var(--danger); box-shadow: 0 0 0 5px rgba(163,49,39,.13); }
    @keyframes pulse { 50% { opacity: .5; transform: scale(.72); } }
    h1 { margin: 0; font-size: clamp(16px, 4vw, 20px); line-height: 1.48; font-weight: 700; letter-spacing: -.01em; }
    .message { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .facts { display: none; gap: 6px; flex-wrap: wrap; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); }
    .facts.show { display: flex; }
    .chip { display: inline-flex; min-height: 27px; align-items: center; padding: 4px 8px; border-radius: 7px; background: var(--accent-soft); color: var(--accent-strong); font: 700 10.5px/1.35 Manrope,"Noto Sans Myanmar",sans-serif; }
    .retry { margin-top: 10px; min-height: 38px; padding: 8px 12px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }

    .map-tools { position: absolute; z-index: 6; top: max(12px, env(safe-area-inset-top)); right: 12px; display: grid; gap: 8px; }
    .tool-btn { display: grid; place-items: center; width: 48px; min-height: 48px; padding: 0; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-solid); color: var(--accent-strong); box-shadow: var(--shadow); cursor: pointer; font-weight: 700; }
    .tool-btn svg { width: 23px; height: 23px; }
    .mode-btn { font: 700 12px/1 Manrope,"Noto Sans Myanmar",sans-serif; }
    .tool-btn:focus-visible, .retry:focus-visible { outline: 3px solid var(--accent-strong); outline-offset: 3px; }

    .tip { position: absolute; z-index: 4; left: 12px; bottom: max(30px, calc(env(safe-area-inset-bottom) + 14px)); max-width: min(330px, calc(100% - 24px)); padding: 9px 11px; border: 1px solid var(--line); border-radius: 11px 11px 4px 11px; background: var(--surface); color: var(--muted); box-shadow: 0 8px 22px rgba(7,27,21,.13); font-size: 10.5px; line-height: 1.6; }
    .tip strong { color: var(--ink); }

    .you-marker { position: relative; width: 21px; height: 21px; border: 4px solid #fff; border-radius: 50%; background: #087f67; box-shadow: 0 2px 8px rgba(0,0,0,.38); }
    .you-marker::after { content: ""; position: absolute; inset: -10px; border: 2px solid rgba(8,127,103,.38); border-radius: 50%; }

    .maplibregl-ctrl-top-right { top: 126px; right: 2px; }
    .maplibregl-ctrl-group { border: 1px solid var(--line); border-radius: 12px !important; overflow: hidden; box-shadow: var(--shadow) !important; }
    .maplibregl-ctrl-group button { width: 42px; height: 42px; background-color: var(--surface-solid); }
    .maplibregl-ctrl button .maplibregl-ctrl-icon { filter: none; }
    .maplibregl-ctrl-attrib { font-family: Manrope, sans-serif; font-size: 10px; }
    .maplibregl-popup { max-width: min(320px, calc(100vw - 30px)) !important; }
    .maplibregl-popup-content { padding: 14px 36px 13px 14px; border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; background: var(--surface-solid); color: var(--ink); box-shadow: var(--shadow); }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: var(--surface-solid); }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: var(--surface-solid); }
    .maplibregl-popup-close-button { top: 7px; right: 7px; width: 27px; height: 27px; border-radius: 7px; background: var(--accent-soft); color: var(--accent-strong); font-size: 18px; }
    .popup-type { margin: 0 0 3px; color: var(--accent-strong); font: 700 10px/1.4 Manrope,"Noto Sans Myanmar",sans-serif; }
    .popup-name { margin: 0; font-size: 15px; line-height: 1.55; }
    .popup-address { margin: 4px 0 0; color: var(--muted); font-size: 11.5px; line-height: 1.65; }

    .load-fail { position: absolute; z-index: 9; inset: 0; display: grid; place-items: center; padding: 24px; background: #dce8e3; }
    .load-fail > div { width: min(420px,100%); padding: 24px; border-radius: 18px; background: var(--surface-solid); box-shadow: var(--shadow); text-align: center; }
    .load-fail h2 { margin: 0; font-size: 20px; }
    .load-fail p { margin: 8px 0 0; color: var(--muted); line-height: 1.7; }

    @media (max-width: 520px) {
      .info-card { top: max(9px, env(safe-area-inset-top)); left: 9px; width: calc(100% - 126px); padding: 12px 13px 11px; }
      .map-tools { top: max(9px, env(safe-area-inset-top)); right: 9px; }
      .tool-btn { width: 46px; min-height: 46px; }
      .maplibregl-ctrl-top-right { top: 116px; right: 0; }
      .tip { left: 9px; bottom: max(30px, calc(env(safe-area-inset-bottom) + 13px)); max-width: calc(100% - 18px); }
      .message { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { .status-dot.busy { animation: none; } }
  </style>
</head>
<body>
  <main class="app" aria-label="သုံးဖက်မြင် လက်ရှိတည်နေရာမြေပုံ">
    <div id="map" role="region" aria-label="လမ်း၊ မြို့နှင့် သုံးဖက်မြင်အဆောက်အအုံများပါသော မြေပုံ"></div>

    <section class="info-card" aria-live="polite">
      <div class="status-row">
        <span class="status-dot busy" id="statusDot" aria-hidden="true"></span>
        <div>
          <h1 id="statusTitle">GPS တည်နေရာကို ရှာနေသည်</h1>
          <p class="message" id="statusMessage">Location ခွင့်ပြုချက်တောင်းသည့်အခါ “Allow” ကိုနှိပ်ပါ။</p>
        </div>
      </div>
      <div class="facts" id="facts">
        <span class="chip" id="accuracyChip">GPS —</span>
        <span class="chip" id="coordChip">—</span>
      </div>
      <button class="retry" id="retryBtn" type="button" hidden>ထပ်မံရှာမည်</button>
    </section>

    <div class="map-tools" aria-label="မြေပုံကိရိယာများ">
      <button class="tool-btn" id="locateBtn" type="button" aria-label="လက်ရှိတည်နေရာသို့ သွားမည်" title="လက်ရှိတည်နေရာ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/><circle cx="12" cy="12" r="8"/></svg>
      </button>
      <button class="tool-btn mode-btn" id="modeBtn" type="button" aria-label="နှစ်ဖက်မြင်မြေပုံသို့ ပြောင်းမည်">2D</button>
    </div>

    <aside class="tip" id="tip"><strong>တိုက်ကိုနှိပ်ကြည့်ပါ။</strong> နာမည်ရှိပါက နာမည်နှင့် လိပ်စာကို ပြပေးမည်။ မြေပုံကို လက်နှစ်ချောင်းဖြင့် လှည့်၍ စောင်းနိုင်ပါသည်။</aside>
    <section class="load-fail" id="loadFail" hidden>
      <div><h2>မြေပုံ မဖွင့်နိုင်ပါ</h2><p>အင်တာနက်ချိတ်ဆက်မှုကို စစ်ပြီး page ကို ပြန်ဖွင့်ပါ။</p></div>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script>
    (function () {
      'use strict';
      var STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
      var DEFAULT_CENTER = [96.1, 19.7];
      var statusDot = document.getElementById('statusDot');
      var statusTitle = document.getElementById('statusTitle');
      var statusMessage = document.getElementById('statusMessage');
      var facts = document.getElementById('facts');
      var accuracyChip = document.getElementById('accuracyChip');
      var coordChip = document.getElementById('coordChip');
      var retryBtn = document.getElementById('retryBtn');
      var locateBtn = document.getElementById('locateBtn');
      var modeBtn = document.getElementById('modeBtn');
      var loadFail = document.getElementById('loadFail');
      var currentPosition = null;
      var map = null;
      var marker = null;
      var is3D = true;
      var locationSerial = 0;
      var lookupSerial = 0;

      function setBusy() {
        statusDot.className = 'status-dot busy';
        statusTitle.textContent = 'GPS တည်နေရာကို ရှာနေသည်';
        statusMessage.textContent = 'Location ခွင့်ပြုချက်တောင်းသည့်အခါ “Allow” ကိုနှိပ်ပါ။';
        retryBtn.hidden = true;
      }

      function setLocationError(kind) {
        statusDot.className = 'status-dot error';
        retryBtn.hidden = false;
        if (kind === 'denied') {
          statusTitle.textContent = 'Location ခွင့်ပြုချက် လိုအပ်သည်';
          statusMessage.textContent = 'Browser settings တွင် Location ကို Allow လုပ်ပြီး ထပ်စမ်းပါ။ မြေပုံကိုတော့ ယခုကြည့်နိုင်ပါသည်။';
        } else if (kind === 'unsupported') {
          statusTitle.textContent = 'ဤဖုန်းတွင် GPS မရနိုင်ပါ';
          statusMessage.textContent = 'GPS မရသော်လည်း 3D မြေပုံကို လှည့်ကြည့်နိုင်ပါသည်။';
        } else if (kind === 'timeout') {
          statusTitle.textContent = 'GPS အချက်ပြ မရသေးပါ';
          statusMessage.textContent = 'Location ကိုဖွင့်ထားကြောင်း စစ်ပြီး ထပ်စမ်းပါ။';
        } else {
          statusTitle.textContent = 'တည်နေရာ မတွေ့သေးပါ';
          statusMessage.textContent = 'Location service နှင့် အင်တာနက်ကို စစ်ပြီး ထပ်စမ်းပါ။';
        }
      }

      function cityLabel(data) {
        var a = data && data.address ? data.address : {};
        return a.city || a.town || a.village || a.municipality || a.county || a.state || '';
      }

      function addressLabel(data) {
        var a = data && data.address ? data.address : {};
        var parts = [];
        var street = [a.house_number, a.road || a.pedestrian || a.footway].filter(Boolean).join(' ');
        [street, a.neighbourhood || a.suburb || a.quarter, cityLabel(data), a.state, a.country].forEach(function (part) {
          if (part && parts.indexOf(part) === -1) parts.push(part);
        });
        return parts.join(', ') || (data && data.display_name) || '';
      }

      function reverseLookup(lat, lng, language) {
        var url = new URL('https://nominatim.openstreetmap.org/reverse');
        url.searchParams.set('format', 'jsonv2');
        url.searchParams.set('lat', lat.toFixed(7));
        url.searchParams.set('lon', lng.toFixed(7));
        url.searchParams.set('zoom', '18');
        url.searchParams.set('addressdetails', '1');
        url.searchParams.set('namedetails', '1');
        url.searchParams.set('accept-language', language || 'my,en');
        return fetch(url.toString(), { headers: { 'Accept': 'application/json' } }).then(function (response) {
          if (!response.ok) throw new Error('reverse lookup failed');
          return response.json();
        });
      }

      function updateCity(lat, lng) {
        reverseLookup(lat, lng, 'my,en').then(function (data) {
          var city = cityLabel(data);
          statusTitle.textContent = city || 'လက်ရှိတည်နေရာ';
          statusMessage.textContent = 'လက်ရှိတည်နေရာ၏ 3D မြေပုံ — တိုက်ကိုနှိပ်ပြီး နာမည်နှင့် လိပ်စာကိုကြည့်ပါ။';
        }).catch(function () {
          statusTitle.textContent = 'လက်ရှိတည်နေရာ';
          statusMessage.textContent = '3D မြေပုံရရှိပါပြီ။ တိုက်ကိုနှိပ်ပြီး အချက်အလက်ကိုကြည့်ပါ။';
        });
      }

      function extrusionPaint() {
        return {
          'fill-extrusion-color': [
            'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 12],
            0, '#d6d5ce', 20, '#bbbdb8', 60, '#979e9b', 150, '#707d79'
          ],
          'fill-extrusion-height': [
            'case',
            ['has', 'render_height'], ['get', 'render_height'],
            ['has', 'height'], ['to-number', ['get', 'height'], 12],
            ['has', 'building:levels'], ['*', ['to-number', ['get', 'building:levels'], 4], 3],
            12
          ],
          'fill-extrusion-base': [
            'case',
            ['has', 'render_min_height'], ['get', 'render_min_height'],
            ['has', 'min_height'], ['to-number', ['get', 'min_height'], 0],
            0
          ],
          'fill-extrusion-opacity': 0.92,
          'fill-extrusion-vertical-gradient': true
        };
      }

      function addBuildings() {
        if (map.getLayer('muse-3d-buildings')) return;
        var style = map.getStyle();
        var sources = style && style.sources ? style.sources : {};
        var sourceId = sources.openmaptiles ? 'openmaptiles' : Object.keys(sources).filter(function (key) { return sources[key] && sources[key].type === 'vector'; })[0];
        if (!sourceId) return;
        var firstLabel = null;
        var layers = style.layers || [];
        for (var i = 0; i < layers.length; i++) {
          if (layers[i].type === 'symbol' && layers[i].layout && layers[i].layout['text-field']) { firstLabel = layers[i].id; break; }
        }
        map.addLayer({
          id: 'muse-3d-buildings',
          type: 'fill-extrusion',
          source: sourceId,
          'source-layer': 'building',
          minzoom: 14,
          paint: extrusionPaint()
        }, firstLabel || undefined);
      }

      function safeText(value) {
        return String(value || '').replace(/[&<>"']/g, function (char) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
        });
      }

      function localFeatureName(feature) {
        var p = feature && feature.properties ? feature.properties : {};
        return p['name:my'] || p.name || p['name:en'] || p.ref || '';
      }

      function showBuildingPopup(event) {
        var serial = ++lookupSerial;
        var features = [];
        try { features = map.queryRenderedFeatures(event.point, { layers: ['muse-3d-buildings'] }); } catch (ignore) {}
        var localName = features.length ? localFeatureName(features[0]) : '';
        var popup = new maplibregl.Popup({ closeButton: true, closeOnClick: true, maxWidth: '320px', offset: 10 })
          .setLngLat(event.lngLat)
          .setHTML('<p class="popup-type">OpenStreetMap</p><h2 class="popup-name">နေရာအချက်အလက် ရှာနေသည်…</h2>')
          .addTo(map);
        reverseLookup(event.lngLat.lat, event.lngLat.lng, 'my,en').then(function (data) {
          if (serial !== lookupSerial || !popup.isOpen()) return;
          var named = data.namedetails && (data.namedetails['name:my'] || data.namedetails.name || data.namedetails['name:en']);
          var name = localName || named || data.name || '';
          var address = addressLabel(data);
          popup.setHTML(
            '<p class="popup-type">' + (features.length ? 'အဆောက်အအုံ' : 'ရွေးထားသောနေရာ') + '</p>' +
            '<h2 class="popup-name">' + safeText(name || address || 'နာမည်မသွင်းရသေးသောနေရာ') + '</h2>' +
            '<p class="popup-address">' + safeText(name ? (address || 'လိပ်စာ မရှိသေးပါ') : (data.display_name || address || 'OpenStreetMap တွင် အချက်အလက် မရှိသေးပါ')) + '</p>'
          );
        }).catch(function () {
          if (serial !== lookupSerial || !popup.isOpen()) return;
          popup.setHTML(
            '<p class="popup-type">' + (features.length ? 'အဆောက်အအုံ' : 'ရွေးထားသောနေရာ') + '</p>' +
            '<h2 class="popup-name">' + safeText(localName || 'အချက်အလက် မရနိုင်သေးပါ') + '</h2>' +
            '<p class="popup-address">' + event.lngLat.lat.toFixed(6) + ', ' + event.lngLat.lng.toFixed(6) + '</p>'
          );
        });
      }

      function renderPosition(position) {
        currentPosition = position;
        var c = position.coords;
        var lat = Number(c.latitude);
        var lng = Number(c.longitude);
        var accuracy = Math.max(1, Math.round(c.accuracy));
        statusDot.className = 'status-dot';
        statusTitle.textContent = 'လက်ရှိတည်နေရာ';
        statusMessage.textContent = 'သင့်နေရာသို့ 3D မြေပုံဖြင့် သွားနေသည်…';
        accuracyChip.textContent = 'တိကျမှု ±' + accuracy + ' m';
        coordChip.textContent = lat.toFixed(5) + ', ' + lng.toFixed(5);
        facts.classList.add('show');
        retryBtn.hidden = true;
        if (marker) marker.remove();
        var markerEl = document.createElement('div');
        markerEl.className = 'you-marker';
        markerEl.setAttribute('aria-label', 'လက်ရှိတည်နေရာ');
        marker = new maplibregl.Marker({ element: markerEl }).setLngLat([lng, lat]).addTo(map);
        map.flyTo({ center: [lng, lat], zoom: 17.3, pitch: 60, bearing: -18, duration: 2400, essential: true });
        is3D = true;
        modeBtn.textContent = '2D';
        modeBtn.setAttribute('aria-label', 'နှစ်ဖက်မြင်မြေပုံသို့ ပြောင်းမည်');
        updateCity(lat, lng);
      }

      function requestLocation() {
        var serial = ++locationSerial;
        setBusy();
        if (!navigator.geolocation) { setLocationError('unsupported'); return; }
        navigator.geolocation.getCurrentPosition(function (position) {
          if (serial !== locationSerial) return;
          renderPosition(position);
        }, function (error) {
          if (serial !== locationSerial) return;
          if (error && error.code === 1) setLocationError('denied');
          else if (error && error.code === 3) setLocationError('timeout');
          else setLocationError('unknown');
        }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 12000 });
      }

      function toggleMode() {
        is3D = !is3D;
        map.easeTo({ pitch: is3D ? 60 : 0, bearing: is3D ? map.getBearing() || -18 : 0, duration: 900 });
        modeBtn.textContent = is3D ? '2D' : '3D';
        modeBtn.setAttribute('aria-label', is3D ? 'နှစ်ဖက်မြင်မြေပုံသို့ ပြောင်းမည်' : 'သုံးဖက်မြင်မြေပုံသို့ ပြောင်းမည်');
      }

      function initMap() {
        if (!window.maplibregl || !maplibregl.supported()) {
          loadFail.hidden = false;
          return;
        }
        map = new maplibregl.Map({
          container: 'map',
          style: STYLE_URL,
          center: DEFAULT_CENTER,
          zoom: 5.2,
          pitch: 48,
          bearing: -12,
          antialias: true,
          maxPitch: 85,
          attributionControl: { compact: true }
        });
        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true, showZoom: true, showCompass: true }), 'top-right');
        map.on('load', function () {
          try { addBuildings(); } catch (error) { console.warn('3D buildings unavailable', error); }
          requestLocation();
        });
        map.on('styledata', function () {
          if (map.isStyleLoaded()) {
            try { addBuildings(); } catch (ignore) {}
          }
        });
        map.on('click', showBuildingPopup);
        map.on('mousemove', function (event) {
          var hit = [];
          try { hit = map.queryRenderedFeatures(event.point, { layers: ['muse-3d-buildings'] }); } catch (ignore) {}
          map.getCanvas().style.cursor = hit.length ? 'pointer' : '';
        });
        map.on('error', function (event) {
          if (!map.loaded() && event && event.error) console.warn('Map resource error', event.error.message || event.error);
        });
      }

      retryBtn.addEventListener('click', requestLocation);
      locateBtn.addEventListener('click', function () {
        if (currentPosition) renderPosition(currentPosition);
        else requestLocation();
      });
      modeBtn.addEventListener('click', toggleMode);
      window.addEventListener('load', initMap);
    })();
  </script>
</body>
</html>
